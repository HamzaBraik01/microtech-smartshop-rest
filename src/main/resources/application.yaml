spring:
  application:
    name: smartshop
  datasource:
    url: jdbc:postgresql://localhost:5432/smartshop
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
      change-log: classpath:db/changelog/db.changelog-master.yaml