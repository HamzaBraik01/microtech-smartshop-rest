databaseChangeLog:
  - changeSet:
      id: 005-create-orders-table
      author: HamzaBraik01
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_ref
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: sub_total
                  type: DECIMAL(19, 2)
              - column:
                  name: discount_amount
                  type: DECIMAL(19, 2)
              - column:
                  name: tax_amount
                  type: DECIMAL(19, 2)
              - column:
                  name: total_amount
                  type: DECIMAL(19, 2)
              - column:
                  name: remaining_amount
                  type: DECIMAL(19, 2)
              - column:
                  name: promo_code
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: client_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: client_id
            baseTableName: orders
            constraintName: fk_order_client
            referencedColumnNames: id
            referencedTableName: clients

  - changeSet:
      id: 006-create-order-items-table
      author: youcode
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: order_id
            baseTableName: order_items
            constraintName: fk_item_order
            referencedColumnNames: id
            referencedTableName: orders
        - addForeignKeyConstraint:
            baseColumnNames: product_id
            baseTableName: order_items
            constraintName: fk_item_product
            referencedColumnNames: id
            referencedTableName: products

  - changeSet:
      id: 007-create-payments-table
      author: youcode
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: payment_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: clearing_date
                  type: TIMESTAMP
              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: reference
                  type: VARCHAR(100)
              - column:
                  name: payment_number
                  type: INT
              - column:
                  name: method
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: order_id
            baseTableName: payments
            constraintName: fk_payment_order
            referencedColumnNames: id
            referencedTableName: orders